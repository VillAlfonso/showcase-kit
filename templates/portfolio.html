<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{
  --accent:#6a5cff;
  --bg:#0d0f14; --card:#151924; --line:#232a3a; --fg:#e9ebf2; --muted:#96a0b5; --chip:#1d2331;
  --radius:16px; --maxw:1120px;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 14px 34px -14px rgba(0,0,0,.65);
  --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f7f7f9; --card:#fff; --line:#e5e7ee; --fg:#14171f; --muted:#5a6274; --chip:#eef0f6;
  --shadow:0 1px 2px rgba(20,24,40,.06),0 18px 40px -20px rgba(20,24,40,.20); }
}
:root[data-theme="dark"]{ --bg:#0d0f14; --card:#151924; --line:#232a3a; --fg:#e9ebf2; --muted:#96a0b5; --chip:#1d2331; --shadow:0 1px 0 rgba(255,255,255,.03),0 14px 34px -14px rgba(0,0,0,.65); }
:root[data-theme="light"]{ --bg:#f7f7f9; --card:#fff; --line:#e5e7ee; --fg:#14171f; --muted:#5a6274; --chip:#eef0f6; --shadow:0 1px 2px rgba(20,24,40,.06),0 18px 40px -20px rgba(20,24,40,.20); }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--fg); font:16px/1.62 var(--sans); -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1100px 460px at 18% -6%, color-mix(in oklab,var(--accent) 13%,transparent), transparent 62%);
  background-repeat:no-repeat}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 24px}
.top{position:sticky; top:0; z-index:20; backdrop-filter:blur(12px); background:color-mix(in oklab,var(--bg) 78%,transparent); border-bottom:1px solid var(--line)}
.top .wrap{display:flex; align-items:center; gap:14px; height:58px}
.brand{font-weight:700; letter-spacing:-.01em; cursor:pointer; background:none; border:0; color:inherit; font-size:15.5px; padding:0; font-family:var(--serif)}
.brand em{color:var(--accent); font-style:normal}
.spacer{flex:1}
.tbtn{border:1px solid var(--line); background:var(--card); color:var(--muted); border-radius:10px; padding:7px 11px; font-size:13px; cursor:pointer}
.tbtn:hover{color:var(--fg); border-color:color-mix(in oklab,var(--accent) 45%,var(--line))}
/* ---------- landing ---------- */
.hero{padding:76px 0 30px}
.eyebrow{color:var(--accent); font-weight:600; letter-spacing:.16em; text-transform:uppercase; font-size:11.5px}
.hero h1{font-family:var(--serif); font-weight:600; font-size:clamp(34px,5.4vw,58px); line-height:1.03; letter-spacing:-.015em; margin:.3em 0 .22em}
.hero .bio{color:var(--muted); font-size:clamp(15px,2vw,18.5px); max-width:60ch; margin:0}
.owner-links{display:flex; gap:10px; flex-wrap:wrap; margin-top:22px}
.owner-links a{font-size:13.5px; color:var(--muted); text-decoration:none; border:1px solid var(--line); padding:7px 14px; border-radius:999px; background:var(--card)}
.owner-links a:hover{color:var(--fg); border-color:var(--accent)}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px; padding:18px 0 80px}
.card{position:relative; border:1px solid var(--line); background:var(--card); border-radius:var(--radius); overflow:hidden; cursor:pointer; text-align:left; color:inherit; font:inherit; padding:0; box-shadow:var(--shadow); transition:transform .18s ease,border-color .18s ease}
.card:hover{transform:translateY(-4px); border-color:color-mix(in oklab,var(--accent) 60%,var(--line))}
.card.featured{grid-column:span 2}
@media(max-width:700px){ .card.featured{grid-column:span 1} }
.thumb{aspect-ratio:16/9; background:linear-gradient(135deg,color-mix(in oklab,var(--accent) 26%,var(--card)),var(--card)); display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative}
.thumb img,.thumb video{width:100%; height:100%; object-fit:cover; display:block}
.thumb .ph{font-size:34px; color:var(--accent); opacity:.5}
.thumb .live{position:absolute; right:10px; bottom:10px; font-size:10.5px; letter-spacing:.08em; color:#fff; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.25); padding:3px 8px; border-radius:999px; opacity:0; transition:opacity .15s}
.card:hover .live{opacity:1}
.card-body{padding:17px 17px 19px}
.card-body h3{margin:0 0 5px; font-size:19px; letter-spacing:-.01em; font-family:var(--serif); font-weight:600}
.card.featured .card-body h3{font-size:23px}
.card-body .tl{color:var(--muted); font-size:14px; margin:0 0 13px}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{font-size:11.5px; color:var(--muted); background:var(--chip); border:1px solid var(--line); padding:3px 9px; border-radius:999px; white-space:nowrap}
.rowmeta{display:flex; gap:8px; align-items:center; margin-top:13px; color:var(--muted); font-size:12px}
.rowmeta .st{text-transform:capitalize}
.dot{width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent)}
/* ---------- detail ---------- */
.detail{padding:24px 0 90px; animation:fade .28s ease}
@keyframes fade{from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none}}
.back{background:none; border:0; color:var(--muted); cursor:pointer; font:inherit; font-size:14px; padding:6px 0; margin-bottom:12px}
.back:hover{color:var(--fg)}
.herobanner{aspect-ratio:16/9; border:1px solid var(--line); border-radius:18px; overflow:hidden; margin:0 0 26px; background:#000; box-shadow:var(--shadow)}
.herobanner video,.herobanner img{width:100%; height:100%; object-fit:cover; display:block}
.dhead h1{font-family:var(--serif); font-weight:600; font-size:clamp(30px,4.4vw,46px); letter-spacing:-.015em; margin:.16em 0 .14em}
.dhead .tl{color:var(--muted); font-size:18px; margin:0 0 16px; max-width:64ch}
.badges{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:0 0 18px}
.madewith{display:inline-flex; align-items:center; gap:7px; font-size:13px; color:var(--muted); border:1px solid color-mix(in oklab,var(--accent) 40%,var(--line)); background:color-mix(in oklab,var(--accent) 8%,var(--card)); padding:6px 13px; border-radius:999px}
.madewith b{color:var(--accent); font-weight:650}
.dlinks{display:flex; gap:10px; flex-wrap:wrap; margin:2px 0 22px}
.dlinks a{text-decoration:none; font-size:14px; padding:9px 16px; border-radius:11px; border:1px solid var(--line); background:var(--card); color:inherit}
.dlinks a.primary{background:var(--accent); color:#fff; border-color:transparent; box-shadow:0 6px 18px -8px var(--accent)}
.dlinks a:hover{border-color:var(--accent)}
.note{border:1px solid color-mix(in oklab,var(--accent) 40%,var(--line)); background:color-mix(in oklab,var(--accent) 9%,var(--card)); border-radius:14px; padding:16px 19px; margin:0 0 30px; font-size:15.5px}
.note p{margin:0 0 8px} .note p:last-child{margin:0}
.g-head{font-family:var(--serif); font-weight:600; font-size:19px; letter-spacing:-.01em; margin:34px 0 14px; display:flex; align-items:baseline; gap:10px}
.g-head::after{content:""; flex:1; height:1px; background:var(--line)}
.gallery{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:16px}
figure{margin:0}
figcaption{color:var(--muted); font-size:12.5px; margin-top:8px; line-height:1.5}
.gallery video.vid{width:100%; aspect-ratio:16/10; border:1px solid var(--line); border-radius:13px; background:#000; display:block; object-fit:cover}
.shot{aspect-ratio:16/10; border:1px solid var(--line); border-radius:13px; overflow:hidden; background:linear-gradient(135deg,color-mix(in oklab,var(--accent) 20%,var(--card)),var(--card)); display:flex; align-items:flex-end; position:relative}
.shot.has{cursor:zoom-in}
.shot img{width:100%; height:100%; object-fit:cover; display:block}
.shot .cap{position:relative; z-index:1; padding:10px 12px; font-size:12.5px; color:var(--muted)}
.shot.has .cap{display:none}
.cols{display:grid; grid-template-columns:1fr; gap:38px; margin-top:38px}
@media(min-width:840px){ .cols{grid-template-columns:1.55fr .95fr} }
.sec{margin-bottom:32px}
.sec h2{font-size:12px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); margin:0 0 12px; font-weight:650}
.sec p{margin:0 0 11px}
.hl{list-style:none; padding:0; margin:0; display:grid; gap:11px}
.hl li{padding-left:24px; position:relative}
.hl li::before{content:"\2192"; position:absolute; left:0; color:var(--accent)}
.metrics{display:grid; grid-template-columns:repeat(auto-fill,minmax(124px,1fr)); gap:12px}
.metric{border:1px solid var(--line); background:var(--card); border-radius:13px; padding:14px 14px 12px}
.metric .v{font-size:22px; font-weight:700; letter-spacing:-.01em; color:var(--accent); font-family:var(--serif)}
.metric .l{font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.35}
.lb{position:fixed; inset:0; background:rgba(4,5,8,.9); display:none; align-items:center; justify-content:center; z-index:50; padding:30px; cursor:zoom-out; flex-direction:column; gap:12px}
.lb.open{display:flex}
.lb img{max-width:100%; max-height:88vh; border-radius:10px}
.lb .lbcap{color:#c9cfdd; font-size:13.5px; max-width:80ch; text-align:center}
footer{border-top:1px solid var(--line); color:var(--muted); font-size:13px}
footer .wrap{padding:24px; display:flex; gap:8px; flex-wrap:wrap}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="brand" onclick="location.hash='#/'">&#9670; <em id="brandName"></em></button>
  <div class="spacer"></div>
  <button class="tbtn" id="themeBtn">&#9680; theme</button>
</div></header>
<main id="app" class="wrap"></main>
<div class="lb" id="lb"><img alt=""><div class="lbcap" id="lbcap"></div></div>
<footer><div class="wrap" id="foot"></div></footer>

<script id="data" type="application/json">{{DATA}}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const OWNER = DATA.owner || {};
const PROJECTS = (DATA.projects || []).slice().sort((a,b) =>
  (b.featured?1:0)-(a.featured?1:0) || (b.year||0)-(a.year||0));
if (OWNER.accent) document.documentElement.style.setProperty('--accent', OWNER.accent);
document.getElementById('brandName').textContent = OWNER.name || 'Portfolio';
const bySlug = Object.fromEntries(PROJECTS.map(p => [p.slug, p]));

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function chips(a){return (a||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join('');}
function isVid(m){return !!m && (m.type==='video' || /\.(webm|mp4|mov|m4v)$/i.test(m.src||''));}
function heroMedia(p){return (p.media||[]).find(x=>x.role==='hero')||(p.media||[])[0];}
function posterOf(m){if(!m)return '';return m.type==='image'?(m.src||''):(m.poster||'');}
function mdish(t){
  return String(t||'').split(/\n{2,}/).map(b=>b.trim()).filter(Boolean).map(b=>{
    if(/^[-*] /m.test(b)){
      const items=b.split(/\n(?=[-*] )/).map(l=>l.replace(/^[-*] /,'').trim()).filter(Boolean);
      return '<ul class="hl">'+items.map(i=>`<li>${esc(i)}</li>`).join('')+'</ul>';
    }
    return `<p>${esc(b)}</p>`;
  }).join('');
}

function landing(){
  const cards = PROJECTS.map(p=>{
    const hm=heroMedia(p); const poster=posterOf(hm)||((p.media||[]).find(x=>x&&x.type==='image'&&x.src)||{}).src||'';
    const vid=isVid(hm)&&hm.src?esc(hm.src):'';
    const inner=poster?`<img src="${esc(poster)}" alt="${esc((hm&&hm.caption)||p.name)}" onerror="this.remove()">`:`<span class="ph">&#9670;</span>`;
    return `
    <button class="card ${p.featured?'featured':''}" data-vid="${vid}" onclick="location.hash='#/p/${esc(p.slug)}'">
      <div class="thumb">${inner}${vid?'<span class="live">▶ preview</span>':''}</div>
      <div class="card-body">
        <h3>${esc(p.name)}</h3>
        <p class="tl">${esc(p.tagline||'')}</p>
        <div class="chips">${chips((p.tech||[]).slice(0,5))}</div>
        <div class="rowmeta"><span class="dot"></span><span class="st">${esc(p.status||'')}</span>${p.year?'<span>&middot; '+p.year+'</span>':''}${p.made_with?'<span>&middot; made with '+esc(p.made_with)+'</span>':''}</div>
      </div>
    </button>`;}).join('');
  return `<section class="hero">
      <div class="eyebrow">${esc(OWNER.role||'Selected work')}</div>
      <h1>${esc(OWNER.name||'My Projects')}</h1>
      <p class="bio">${esc(OWNER.bio||'')}</p>
      ${(OWNER.links&&OWNER.links.length)?`<div class="owner-links">${OWNER.links.map(l=>`<a href="${esc(l.url)}">${esc(l.label)}</a>`).join('')}</div>`:''}
    </section>
    <section class="grid">${cards||'<p>No projects yet.</p>'}</section>`;
}

function galleryHTML(items){
  return items.map(m=>{
    if(isVid(m)) return `<figure><video class="vid" src="${esc(m.src)}" ${m.poster?`poster="${esc(m.poster)}"`:''} controls muted loop playsinline preload="metadata"></video>${m.caption?`<figcaption>${esc(m.caption)}</figcaption>`:''}</figure>`;
    const has=!!m.src;
    const img=has?`<img src="${esc(m.src)}" alt="${esc(m.caption||'')}" onerror="this.parentNode.classList.remove('has');this.remove()">`:'';
    const cap=m.caption?`<span class="cap">${esc(m.caption)}</span>`:'';
    return `<figure><div class="shot ${has?'has':''}" data-full="${esc(m.src||'')}" data-cap="${esc(m.caption||'')}">${img}${cap}</div>${has&&m.caption?`<figcaption>${esc(m.caption)}</figcaption>`:''}</figure>`;
  }).join('');
}

function detail(p){
  const hm=heroMedia(p);
  let banner='';
  if(hm){
    if(isVid(hm)) banner=`<div class="herobanner"><video src="${esc(hm.src)}" ${hm.poster?`poster="${esc(hm.poster)}"`:''} controls muted loop playsinline preload="metadata"></video></div>`;
    else if(hm.src) banner=`<div class="herobanner"><img src="${esc(hm.src)}" alt="${esc(hm.caption||p.name)}"></div>`;
  }
  const rest=(p.media||[]).filter(m=>m!==hm);
  const groups=[];                                  // keep first-seen order
  rest.forEach(m=>{ const g=m.group||'Walkthrough';
    let e=groups.find(x=>x.name===g); if(!e){e={name:g,items:[]}; groups.push(e);} e.items.push(m); });
  const galleries=groups.map(g=>`<div class="g-head">${esc(g.name)}</div><div class="gallery">${galleryHTML(g.items)}</div>`).join('');
  const links=(p.links||[]).filter(l=>l.url).map((l,i)=>`<a class="${i===0?'primary':''}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label||l.kind||'Link')}</a>`).join('');
  const metrics=(p.metrics||[]).map(m=>`<div class="metric"><div class="v">${esc(m.value)}</div><div class="l">${esc(m.label)}</div></div>`).join('');
  const sections=(p.sections||[]).map(s=>`<div class="sec"><h2>${esc(s.heading)}</h2>${mdish(s.body)}</div>`).join('');
  const highlights=(p.highlights&&p.highlights.length)?`<div class="sec"><h2>Highlights</h2><ul class="hl">${p.highlights.map(h=>`<li>${esc(h)}</li>`).join('')}</ul></div>`:'';
  return `<article class="detail">
    <button class="back" onclick="location.hash='#/'">&#8592; All projects</button>
    ${banner}
    <div class="dhead">
      <div class="eyebrow">${esc(p.status||'')}${p.year?' &middot; '+p.year:''}${p.role?' &middot; '+esc(p.role):''}</div>
      <h1>${esc(p.name)}</h1>
      <p class="tl">${esc(p.tagline||'')}</p>
    </div>
    <div class="badges">${p.made_with?`<span class="madewith">Made with <b>${esc(p.made_with)}</b></span>`:''}</div>
    ${links?`<div class="dlinks">${links}</div>`:''}
    ${p.note?`<div class="note">${mdish(p.note)}</div>`:''}
    ${galleries}
    <div class="cols">
      <div>
        ${p.summary?`<div class="sec"><h2>Overview</h2>${mdish(p.summary)}</div>`:''}
        ${p.problem?`<div class="sec"><h2>The problem</h2>${mdish(p.problem)}</div>`:''}
        ${sections}
      </div>
      <aside>
        ${highlights}
        ${(p.tech&&p.tech.length)?`<div class="sec"><h2>Built with</h2><div class="chips">${chips(p.tech)}</div></div>`:''}
        ${metrics?`<div class="sec"><h2>By the numbers</h2><div class="metrics">${metrics}</div></div>`:''}
      </aside>
    </div>
  </article>`;
}

function render(){
  const app=document.getElementById('app');
  const m=(location.hash||'#/').match(/^#\/p\/(.+)$/);
  if(m && bySlug[decodeURIComponent(m[1])]){ app.innerHTML=detail(bySlug[decodeURIComponent(m[1])]); wireShots(); }
  else { app.innerHTML=landing(); wireHover(); }
  window.scrollTo(0,0);
}
function wireShots(){
  document.querySelectorAll('.shot.has').forEach(s=>{
    const full=s.getAttribute('data-full'); if(!full) return;
    s.addEventListener('click',()=>{
      const lb=document.getElementById('lb');
      lb.querySelector('img').src=full;
      document.getElementById('lbcap').textContent=s.getAttribute('data-cap')||'';
      lb.classList.add('open');
    });
  });
}
function wireHover(){                                 // featured delight: hover plays the hero clip
  document.querySelectorAll('.card[data-vid]').forEach(c=>{
    const src=c.getAttribute('data-vid'); if(!src) return;
    const thumb=c.querySelector('.thumb'); let v=null;
    c.addEventListener('mouseenter',()=>{
      if(v) return;
      v=document.createElement('video');
      Object.assign(v,{src,muted:true,loop:true,playsInline:true,autoplay:true});
      v.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover';
      thumb.appendChild(v);
    });
    c.addEventListener('mouseleave',()=>{ if(v){v.remove(); v=null;} });
  });
}
document.getElementById('lb').addEventListener('click',e=>e.currentTarget.classList.remove('open'));
document.addEventListener('keydown',e=>{ if(e.key==='Escape') document.getElementById('lb').classList.remove('open'); });
const saved=localStorage.getItem('pf-theme'); if(saved) document.documentElement.setAttribute('data-theme',saved);
document.getElementById('themeBtn').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const nx=(cur==='light')?'dark':'light';
  document.documentElement.setAttribute('data-theme',nx); localStorage.setItem('pf-theme',nx);
});
document.getElementById('foot').innerHTML=`<span>${esc(OWNER.name||'')}</span><span>&middot;</span><span>Built with showcase-kit</span><span>&middot;</span><span>${new Date().getFullYear()}</span>`;
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
